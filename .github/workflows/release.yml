name: Build Release Binaries

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    name: Publish checksummed voice binaries
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - name: Check out the tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Check the tagged source
        run: |
          bun run typecheck
          bun test

      - name: Build all release platforms
        run: |
          set -euo pipefail
          mkdir -p dist
          bun build ./src/cli.ts --compile --minify --target=bun-linux-x64-musl --outfile ./dist/voice-to-notion-linux
          bun build ./src/cli.ts --compile --minify --target=bun-darwin-x64 --outfile ./dist/voice-to-notion-macos-x64
          bun build ./src/cli.ts --compile --minify --target=bun-darwin-arm64 --outfile ./dist/voice-to-notion-macos-arm64
          bun build ./src/cli.ts --compile --minify --target=bun-windows-x64 --outfile ./dist/voice-to-notion-windows.exe
          (cd dist && sha256sum voice-to-notion-* > SHA256SUMS)

      - name: Create the GitHub release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          files: |
            dist/voice-to-notion-linux
            dist/voice-to-notion-macos-x64
            dist/voice-to-notion-macos-arm64
            dist/voice-to-notion-windows.exe
            dist/SHA256SUMS
          generate_release_notes: true

      - name: Dispatch the image build after every asset is published
        env:
          GH_TOKEN: ${{ github.token }}
          VOICE_RELEASE: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          gh workflow run docker-publish.yml --ref main \
            -f voice_release="$VOICE_RELEASE"
